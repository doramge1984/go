<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>수업 도구 열기</title>
<style>
  /* QR 연결 페이지: 안드로이드에서 script.google.com 링크를 구글 드라이브 앱이 가로채는 문제를 피하려고,
     이 페이지(강사 사이트 주소) 안에 앱스 스크립트 웹 앱을 그대로 띄웁니다. 주소 형식: go.html#배포ID */
  html,body{margin:0;height:100%;background:#f4f6f9;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1d2733}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f6f9}
  .msg{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
  .msg[hidden]{display:none}
  .box{max-width:420px}
  .box h1{font-size:22px;margin:0 0 8px}
  .box p{margin:0 0 14px;color:#5b6673;line-height:1.6}
  .btn{display:block;width:100%;border:0;border-radius:14px;background:#23303f;color:#fff;font:inherit;font-size:18px;font-weight:800;padding:14px;margin:8px 0;text-decoration:none;cursor:pointer}
  .btn.sub{background:#fff;color:#23303f;border:1.5px solid #23303f}
  .url{word-break:break-all;font-size:13px;background:#fff;border:1px solid #d9dee5;border-radius:10px;padding:8px;margin:8px 0;color:#5b6673}
  .spin{width:34px;height:34px;border:4px solid #d9dee5;border-top-color:#23303f;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="msg" id="loading"><div class="box"><div class="spin"></div><p>수업 도구를 여는 중이에요…</p></div></div>
<div class="msg" id="bad" hidden><div class="box"><h1>주소가 올바르지 않아요</h1><p>교수님 화면의 QR을 다시 찍어 주세요.</p></div></div>
<iframe id="app" title="수업 도구" hidden allow="clipboard-write"></iframe>
<div class="msg" id="help" hidden><div class="box">
  <h1>화면이 열리지 않나요?</h1>
  <p>아래 주소를 복사해 <b>크롬 주소창</b>에 붙여 넣어 주세요.</p>
  <div class="url" id="url"></div>
  <button class="btn" id="copy" type="button">주소 복사</button>
  <button class="btn sub" id="retry" type="button">다시 시도</button>
</div></div>
<script>
(function () {
  var raw = (location.hash || '').replace(/^#/, '') || new URLSearchParams(location.search).get('id') || '';
  var id = (raw.match(/AKfy[A-Za-z0-9_-]{20,}/) || [])[0];
  var $ = function (x) { return document.getElementById(x); };
  if (!id) { $('loading').hidden = true; $('bad').hidden = false; return; }
  var url = 'https://script.google.com/macros/s/' + id + '/exec';
  $('url').textContent = url;
  var f = $('app'), loaded = false;
  f.onload = function () { loaded = true; $('loading').hidden = true; f.hidden = false; };
  f.src = url;
  setTimeout(function () { if (!loaded) { $('loading').hidden = true; $('help').hidden = false; } }, 12000);
  $('retry').onclick = function () { location.reload(); };
  $('copy').onclick = function () {
    var b = this;
    function ok() { b.textContent = '복사됨 ✓'; }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(ok, fb); else fb();
    function fb() { var t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} t.remove(); }
  };
})();
</script>
</body>
</html>
